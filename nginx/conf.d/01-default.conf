# Catch-all. Handles anything that does not match an app's server_name.

# All plain HTTP is redirected to HTTPS, for every app.
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS requests for a name with no site file get a clear message
# instead of silently landing on some other app.
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    default_type text/plain;
    return 404 "nginx is running, but no app is configured for '$host'.\nAdd a file in nginx/conf.d/ (see docs/06-add-another-app.md).\n";
}

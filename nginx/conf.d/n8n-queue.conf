# n8n (queue mode) - see the n8n-queue/ folder
# https://n8n-queue.apps.mylocalhost  ->  container "n8n-queue-main:5678" on the local-shared network
server {
    listen 443 ssl;
    http2 on;
    server_name n8n-queue.apps.mylocalhost;

    # Allow large uploads (files sent to webhooks and forms).
    client_max_body_size 128m;

    location / {
        set $upstream http://n8n-queue-main:5678;
        proxy_pass $upstream;
        proxy_http_version 1.1;

        # Tell the app the original address the browser used.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets (the n8n editor uses one for live updates).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Send responses straight through (needed for streaming and server-sent events).
        proxy_buffering off;
    }
}

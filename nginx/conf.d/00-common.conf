# Settings shared by every site. Loaded first because of the "00-" prefix.

# One wildcard certificate (*.apps.mylocalhost) covers every app.
# Created by nginx/generate-certs.sh (or .ps1).
ssl_certificate     /etc/nginx/certs/apps.mylocalhost.pem;
ssl_certificate_key /etc/nginx/certs/apps.mylocalhost-key.pem;
ssl_protocols       TLSv1.2 TLSv1.3;

# Docker's built-in DNS. Together with "set $upstream ..." in each site file,
# this lets nginx start even when an app is stopped (you get a 502 for that
# app only, instead of nginx refusing to start).
resolver 127.0.0.11 valid=10s ipv6=off;

# WebSocket support: pass "Connection: upgrade" only when the browser asks for it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}
